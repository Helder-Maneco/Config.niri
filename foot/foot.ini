[main]
include=~/.config/foot/retro.ini
font=JetBrainsMono Nerd Font:size=16
pad=8x8
dpi-aware=yes

[cursor]
style=block
blink=no


[mouse]
hide-when-typing=yes

[key-bindings]
# Ctrl+C copia / Ctrl+V cola
clipboard-copy=Control+c
clipboard-paste=Control+v

[text-bindings]
# Ctrl+Shift+C envia o sinal de cancelar/interromper processo (SIGINT)
\x03=Control+Shift+c
