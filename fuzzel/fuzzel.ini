[main]
include=~/.config/fuzzel/manga.ini
font=JetBrainsMono Nerd Font:size=19
dpi-aware=no
icon-theme=Papirus-Dark
prompt="❯ "
placeholder=""
width=35
lines=8
tabs=4
horizontal-pad=10
vertical-pad=10
inner-pad=10
terminal=kitty
anchor=bottom
y-margin=20
layer=overlay
exit-on-keyboard-focus-loss=yes

# Exibe apenas programas que têm arquivo .desktop válido no XDG
filter-desktop=yes

[border]
width=2
radius=10

[dmenu]
mode=text
exit-immediately-if-empty=no
