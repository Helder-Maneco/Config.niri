# More option see https://github.com/mangowm/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 0
blur_params_radius = 0
blur_params_noise = 0
blur_params_brightness = 0
blur_params_contrast = 0
blur_params_saturation = 0

shadows = 0
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 0
shadows_blur = 0
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting (estilo niri: colunas com scroll infinito)
scroller_structs=20
# largura padrao de cada coluna nova (niri: default-column-width 0.5)
scroller_default_proportion=0.5
# nunca centrar a coluna focada (niri: center-focused-column "never")
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
# janela unica: usa a mesma largura padrao em vez de ocupar o ecra todo
# (para ocupar o ecra todo: scroller_default_proportion_single=1.0)
scroller_ignore_proportion_single=0
scroller_default_proportion_single=0.5
# larguras que o bind de "switch_proportion_preset" alterna (1/3, 1/2, 2/3, como no niri)
scroller_proportion_preset=0.33,0.5,0.67

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=35
repeat_delay=200
numlock_on=0
xkb_rules_layout=us

# mouse
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=0
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Barra de tabs dos grupos - Sincronizada com a paleta do terminal
group_bar_height=28
group_bar_decorate_bg_color=0x0e0f16ff
group_bar_decorate_fg_color=0xa39fc4ff
group_bar_decorate_focus_bg_color=0x00b4d8ff
group_bar_decorate_focus_fg_color=0x0e0f16ff
group_bar_decorate_border_color=0x2b2c3bff
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=0
group_bar_decorate_padding_x=8
group_bar_decorate_padding_y=0
group_bar_decorate_font_desc=JetBrainsMono Nerd Font 11
# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
# Todas as tags em scroller (scroll infinito, como o niri)
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ==============================================================================
# KEY BINDINGS 
# ==============================================================================

# System & Reload
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,e,quit
bind=NONE,F1,spawn, systemctl hibernate
bind=NONE,End,spawn, sh -c "cliphist wipe && systemctl poweroff" 
bind=CTRL,Escape,spawn, sh -c "killall waybar 2>/dev/null || waybar &"

# Aplicações
bind=SUPER,Q,spawn, foot
bind=SUPER,space,spawn, /home/flix/.local/bin/fuzzel-toggle
bind=SUPER,Y,spawn, foot -e yazi
bind=NONE,Home,spawn, sh -c "foot nvim"

# Histórico do Clipboard
bind=ALT,space,spawn, sh -c "cliphist list | fuzzel --dmenu | cliphist decode | wl-copy"

# Autostart (exec_once: corre so no arranque, nao duplica ao recarregar a config)
exec_once=swaybg -i /home/flix/wallpapers/Linux.png -m fill
exec_once=waybar

exec_once = wl-paste --type text --watch cliphist store
exec_once = wl-paste --type image --watch cliphist store

# Screenshots
bind=NONE,Print,spawn, sh -c "grim -g \"$(slurp)\" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png && wl-copy < ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png"
bind=SUPER,Print,spawn, sh -c "grim ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png && wl-copy < ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png"

# Audio (Teclas F7, F8, F9 e Multimídia)
bind=NONE,F7,spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,F8,spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bind=NONE,F9,spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bind=NONE,XF86AudioRaiseVolume,spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bind=NONE,XF86AudioMute,spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Navegação e Foco (Vim Keys e Setas)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Movimento de Janelas
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
# Colunas (scroller): equivalente ao consume/expel do niri
# [  -> mete a janela na pilha da coluna da esquerda
# ]  -> tira a janela da pilha, para a direita
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

# Alterna a largura da coluna entre os presets (1/3, 1/2, 2/3)
#bind=SUPER,w,switch_proportion_preset,

# Grupos (tabs estilo kitty)
# SUPER+ALT+h/j/k/l -> junta a janela focada ao grupo da vizinha nessa direccao
bind=ALT,h,groupjoin,left
bind=ALT,l,groupjoin,right
bind=ALT,k,groupjoin,up
bind=ALT,j,groupjoin,down
# SUPER+, / SUPER+. -> tab anterior / seguinte dentro do grupo
bind=ALT,Left,groupfocus,prev
bind=ALT,Right,groupfocus,next
# SUPER+g -> tira a janela do grupo
bind=SUPER,g,groupleave
# SUPER+b -> mostra/esconde a barra de tabs
bind=SUPER,b,togglegroupbar

# Gestão de Janelas
bind=SUPER,Escape,killclient,
bind=SUPER,F,togglemaximizescreen,
bind=SUPER+SHIFT,F,togglefullscreen,
bind=SUPER,V,togglefloating,
bind=SUPER,O,toggleoverview,

# Redimensionamento
bind=SUPER,Minus,resizewin,-50,+0
bind=SUPER,Equal,resizewin,+50,+0

# Workspaces / Tags - Troca de Foco
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Navegação de Workspaces com Alt+S / Alt+W
bind=ALT,S,viewtoright,0
bind=ALT,W,viewtoleft,0

# Workspaces / Tags - Mover Janela
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Mouse Scroll Bindings
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,up
axisbind=SUPER+SHIFT,DOWN,focusdir,down
