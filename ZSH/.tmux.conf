set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on


unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind \\ split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window
# ==============================================================================
# Paleta de Cores - Noir City
# ==============================================================================
thm_bg="#0f0f0f"        # Fundo do céu noturno urbano
thm_fg="#d1d1d1"        # Texto em cinza claro urbano
thm_cyan="#ffffff"      # Branco puro (Luzes dos edifícios)
thm_black="#000000"     # Escuridão total
thm_gray="#1f1f1f"      # Cinza escuro para painéis e separadores
thm_magenta="#b8b8b8"   # Cinza médio brilhante
thm_pink="#888888"      # Cinza metálico
thm_red="#555555"       # Cinza escuro de contraste
thm_green="#c5c5c5"     # Prata suave
thm_yellow="#ffffff"    # Luz forte incandescente
thm_blue="#888888"      # Cinza de janelas inativas
thm_orange="#e0e0e0"    # Branco prateado de destaque
thm_black4="#2b2b2b"    # Cinza carvão para destaques de modo

# ==============================================================================
# Status Bar Settings
# ==============================================================================
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages & Commands
set -g message-style "fg=${thm_cyan},bg=${thm_gray},bold,align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},bold,align=centre"

# Panes (Bordas divisórias)
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_cyan}"

# --- Statusline Left (Sessão atual) ---
set -g status-left "#[fg=${thm_bg},bg=${thm_cyan},bold]  #S #[fg=${thm_cyan},bg=${thm_bg},nobold] "

# --- Windows (Abas ativas e inativas) ---
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator " "

# Janela Ativa (Pill em destaque)
set -g window-status-current-format "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_yellow},bg=${thm_gray},bold]#I #[fg=${thm_bg},bg=${thm_cyan},bold]  #(echo '#{pane_current_path}' | rev | cut -d'/' -f-1 | rev) #[fg=${thm_cyan},bg=${thm_bg}]"

# Janelas Inativas (Pill em cinza)
set -g window-status-format "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_blue},bg=${thm_gray}]#I #[fg=${thm_fg},bg=${thm_gray}]#W #[fg=${thm_gray},bg=${thm_bg}]"

# --- Statusline Right (Indicador de Prefixo + Relógio) ---
set -g status-right "#{?client_prefix,#[fg=${thm_yellow}]#[bg=${thm_bg}]#[fg=${thm_bg}]#[bg=${thm_yellow}]󰘳 PREFIX ,#[fg=${thm_gray}]#[bg=${thm_bg}]#[fg=${thm_fg}]#[bg=${thm_gray}]󰌌 NOR }#[fg=${thm_gray},bg=${thm_bg}] #[fg=${thm_bg},bg=${thm_cyan},bold] 󱑒 %H:%M #[fg=${thm_cyan},bg=${thm_gray}] 󰃭 %d/%m #[fg=${thm_gray},bg=${thm_bg}]"

# Modes
set -g clock-mode-colour "${thm_yellow}"
set -g mode-style "fg=${thm_bg},bg=${thm_cyan},bold"
