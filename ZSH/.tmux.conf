# ==========================================
# PREFIXO: Ctrl+a (Mais ergonômico)
# ==========================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==========================================
# SUPORTE A CORES E MOUSE
# ==========================================
# (Opcional, mas recomendado para cores ricas)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# ==========================================
# DIVIDIR PAINÉIS (Mais visual e intuitivo)
# ==========================================
# Troquei | por v (Vertical) e - por h (Horizontal)
# Fica muito mais fácil associar a letra com o tipo de corte!
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ==========================================
# NAVEGAÇÃO ENTRE PAINÉIS (Estilo Vim + Sem Prefixo!)
# ==========================================
# Usando Alt (M) + h/j/k/l você muda de painel DIRETAMENTE,
# sem precisar apertar Ctrl+a antes. É infinitamente mais rápido.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ==========================================
# NAVEGAÇÃO ENTRE JANELAS (Abas)
# ==========================================
# Alt + Shift + H ou L para alternar entre as abas rapidamente
bind -n M-H previous-window
bind -n M-L next-window

# ==========================================
# REDIMENSIONAR PAINÉIS (Teclas de seta)
# ==========================================
# Em vez de Shift + Vim que pode cansar a mão, use Ctrl+a + Setas.
# O "-r" permite que você segure a seta para redimensionar continuamente.
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# ==========================================
# UTILITÁRIOS E RECARGA
# ==========================================
# 'r' para dar Reload (fácil de lembrar)
bind r source-file ~/.tmux.conf \; display "Config recarregada!"

# Numeração começa do 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g history-limit 5000

# ==========================================
# VISUAL & DESIGN (Inspirado em Metropolis)
# ==========================================
# Paleta de cores extraída de "metropolis.jpg"
# Fundo (Sky Blue): #456A8F
# Primeiro Plano / Texto (Stone Brown): #C3AD9A
# Acento / Janela Ativa (Steel Gray): #7D8A95
# Janela Inativa (Dark Sky): #2F4E6F
# Borda (Sky Blue): #456A8F
# Borda Ativa (Brass): #A79782

set -g status-style          bg=#456A8F,fg=#C3AD9A
set -g status-left          "#[bg=#7D8A95,fg=#2F4E6F,bold] 🌆 #S #[default] "
set -g status-right         "#[fg=#C3AD9A] %H:%M #[fg=#A79782] %d/%m "
set -g status-left-length   30

# Janela inativa
set -g window-status-style          fg=#2F4E6F
set -g window-status-format         " #I:#W "

# Janela ativa (Steel Gray / Acento)
set -g window-status-current-style fg=#7D8A95,bold
set -g window-status-current-format " #I:#W "

# Bordas dos painéis
set -g pane-border-style        fg=#456A8F
set -g pane-active-border-style fg=#A79782

# Mensagens de comando
set -g message-style bg=#7D8A95,fg=#2F4E6F
